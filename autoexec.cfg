// Deadlock VPN loading fix - https://github.com/Jan-Eric-B/deadlock-vpn-loading-fix
//
// Find your Deadlock folder: in Steam, right-click Deadlock → Manage → Browse local files.
// Open game\citadel\cfg\.
// Copy autoexec.cfg from this repository into that folder. If an autoexec.cfg already exists, open it and add this line instead of replacing the file:
// bind "F9" "sv_cheats 1; restart"
//
// Start Deadlock. Whenever the loading screen hangs, press F9 with the console closed.

bind "F9" "sv_cheats 1; restart"
